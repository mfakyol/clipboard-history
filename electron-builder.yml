appId: com.mfakyol.clipboardhistory
productName: Clipboard History
directories:
  buildResources: resources
  output: release # dist/ is Vite's renderer output; npm run dist stages outside the project (scripts/dist.cjs)
files:
  - dist/**
  - electron/**
  - "!electron/mac/**" # Swift source; the compiled helper ships via extraResources
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
  createDesktopShortcut: true
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: resources/icon.png
  category: public.app-category.productivity
  extraResources:
    - from: build/mac/clip-helper
      to: clip-helper
  extendInfo:
    LSUIElement: true # menu bar app, no Dock icon
  # No Developer ID: ad-hoc sign so Apple Silicon runs it; not notarized
  identity: "-"
  hardenedRuntime: false
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
